[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "danmu-autopilot"
version = "0.1.0"
description = "Private automatic danmaku gateway and matching pipeline"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "rapidfuzz>=3.9,<4",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/danmu_autopilot"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

