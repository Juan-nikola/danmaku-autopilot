name: danmu-autopilot

services:
  mysql:
    image: ${MYSQL_IMAGE:?MYSQL_IMAGE is required; run scripts/bootstrap.sh}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --binlog-expire-logs-seconds=259200
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-misaka}
      MYSQL_USER: ${MYSQL_USER:-misaka}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - misaka-mysql:/var/lib/mysql
    networks:
      - danmu-internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1280M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  misaka:
    image: ${MISAKA_IMAGE:?MISAKA_IMAGE is required; run scripts/bootstrap.sh}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MISAKA_BIND_PORT:-7768}:7768"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-misaka}
      MYSQL_USER: ${MYSQL_USER:-misaka}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MISAKA_CONTROL_KEY: ${MISAKA_CONTROL_KEY:?MISAKA_CONTROL_KEY is required}
    volumes:
      - misaka-config:/app/config
      - misaka-cache:/app/cache
    networks:
      - danmu-internal
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7768/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  danmu-api:
    image: ${DANMU_API_IMAGE:?DANMU_API_IMAGE is required; run scripts/bootstrap.sh}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DANMU_API_TOKEN: ${DANMU_API_TOKEN:?DANMU_API_TOKEN is required}
      PORT: "9321"
    volumes:
      - danmu-api-cache:/app/.cache
      - danmu-api-config:/app/config
    networks:
      - danmu-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9321/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  autopilot:
    image: ${AUTOPILOT_IMAGE:-danmu-autopilot:local}
    build:
      context: ./autopilot
      target: runtime
    restart: unless-stopped
    ports:
      - "127.0.0.1:${AUTOPILOT_BIND_PORT:-7770}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MISAKA_BASE_URL: http://misaka:7768
      MISAKA_CONTROL_KEY: ${MISAKA_CONTROL_KEY:?MISAKA_CONTROL_KEY is required}
      DANMU_API_BASE_URL: http://danmu-api:9321
      DANMU_API_TOKEN: ${DANMU_API_TOKEN:?DANMU_API_TOKEN is required}
      PUBLIC_API_TOKEN: ${PUBLIC_API_TOKEN:?PUBLIC_API_TOKEN is required}
      DEVICE_TOKEN_1: ${DEVICE_TOKEN_1:-}
      DEVICE_TOKEN_2: ${DEVICE_TOKEN_2:-}
      DEVICE_TOKEN_3: ${DEVICE_TOKEN_3:-}
      STATE_DIR: /data
      SCRATCH_DIR: /scratch
      SCRATCH_MAX_BYTES: ${SCRATCH_MAX_BYTES:-524288000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-16777216}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-67108864}
      MAX_COMMENTS: ${MAX_COMMENTS:-500000}
    volumes:
      - autopilot-state:/data
      - autopilot-scratch:/scratch
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - danmu-internal
      - danmu-egress
    depends_on:
      mysql:
        condition: service_healthy
      misaka:
        condition: service_healthy
      danmu-api:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  danmu-internal:
    name: danmu-internal
    internal: true
  danmu-egress:
    name: danmu-egress

volumes:
  misaka-mysql:
  misaka-config:
  misaka-cache:
  danmu-api-cache:
  danmu-api-config:
  autopilot-state:
  autopilot-scratch:
